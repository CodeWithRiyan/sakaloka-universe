# =============================================================
# 🌌 Sakaloka-Universe — Docker Compose (Development)
#
# Port scheme: 5xxxx external → standard internal
# ALL bindings use 127.0.0.1 — NEVER 0.0.0.0
# =============================================================

services:

  # ─────────────────────────────────────────────────────────────
  # 🌍 Earth — Axum REST API (apps/api)
  # External: 127.0.0.1:53000 → 3000
  # ─────────────────────────────────────────────────────────────
  # 🐘 PostgreSQL — primary relational database (external infra)
  # Connect to: infra-dev-postgres (Docker network: net-dev)
  # ─────────────────────────────────────────────────────────────

  sakaloka-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "127.0.0.1:53000:3000"
    environment:
      - RUST_LOG=info
      - SAKALOKA_JWT_SECRET=${SAKALOKA_JWT_SECRET}
      - DATABASE_URL=postgres://dev_user:eE4W2heguc8SX7VHu3gs@infra-dev-postgres:5432/sakaloka_db
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - sakaloka-net
      - net-dev

# ─────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────

networks:
  sakaloka-net:
    driver: bridge
    # Internal network — no external routing
  net-dev:
    external: true
