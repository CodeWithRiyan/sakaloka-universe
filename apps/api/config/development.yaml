logger:
  enable: true
  pretty_backtrace: true
  level: debug
  format: compact

server:
  binding: 0.0.0.0
  port: 3000
  middlewares:
    cors:
      enable: true
      allow_origins:
        - http://localhost:5173
        - http://localhost:3000
      allow_headers:
        - Content-Type
        - Authorization
      allow_methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      max_age: 3600

database:
  uri: "{{ get_env(name="DATABASE_URL", default="postgres://sakaloka:sakaloka_dev@127.0.0.1:55432/sakaloka_dev") }}"
  enable_logging: true
  connect_timeout: 5000
  idle_timeout: 5000
  min_connections: 1
  max_connections: 5
  auto_migrate: true

auth:
  jwt:
    secret: "{{ get_env(name="SAKALOKA_JWT_SECRET", default="change-me-at-least-32-chars-long!") }}"
    expiration: 900
