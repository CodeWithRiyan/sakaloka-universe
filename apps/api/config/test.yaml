logger:
  enable: true
  pretty_backtrace: true
  level: debug
  format: compact

server:
  binding: 0.0.0.0
  port: 0
  middlewares:
    cors:
      enable: true
      allow_origins:
        - http://localhost:5173

database:
  uri: "{{ get_env(name="DATABASE_URL", default="postgres://sakaloka:sakaloka_dev@127.0.0.1:55432/sakaloka_test") }}"
  enable_logging: false
  connect_timeout: 5000
  idle_timeout: 5000
  min_connections: 1
  max_connections: 5
  auto_migrate: true
  dangerously_truncate: true
  dangerously_recreate: true

auth:
  jwt:
    secret: "{{ get_env(name="SAKALOKA_JWT_SECRET", default="ci-test-secret-at-least-32-chars-long!") }}"
    expiration: 900
