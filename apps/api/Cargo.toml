[package]
name = "sakaloka-api"
version = "0.1.0"
edition = "2021"
description = "Sakaloka-Universe — Earth: Loco.rs REST API server"
license = "MIT"

[[bin]]
name = "sakaloka-api"
path = "src/main.rs"

[[bin]]
name = "sakaloka-api-cli"
path = "src/bin/tool.rs"

[[bin]]
name = "openapi"
path = "src/bin/openapi.rs"

[dependencies]
# Loco framework
loco-rs = { workspace = true }
migration = { path = "migration" }

# Workspace shared deps
tokio        = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
anyhow       = { workspace = true }
tracing      = { workspace = true }
axum         = { workspace = true }
sha2         = { workspace = true }
chrono       = { workspace = true }
uuid         = { workspace = true }

# Internal crates
sakaloka-core   = { workspace = true }
sakaloka-secure = { workspace = true }

# SeaORM (Loco uses this for DB)
sea-orm = { version = "1.1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-json",
    "with-uuid",
] }

# Async trait for Loco hooks
async-trait = "0.1"

# Axum extras
tower       = "0.5"
tower-http  = { version = "0.6", features = ["trace", "cors"] }
axum-extra  = { version = "0.10", features = ["multipart"] }

# Swagger / OpenAPI
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Argon2 for password hashing
argon2 = { workspace = true }

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serial_test = "3"
