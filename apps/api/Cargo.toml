[package]
name = "sakaloka-api"
version = "0.0.0"
edition = "2021"
description = "Sakaloka-Universe — Earth: Axum REST API server with PostgreSQL"
license = "MIT"

default-run = "sakaloka-api"

[[bin]]
name = "sakaloka-api"
path = "src/main.rs"

[[bin]]
name = "openapi"
path = "src/bin/openapi.rs"

[dependencies]
# Workspace shared deps
tokio        = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
anyhow       = { workspace = true }
dotenvy      = { workspace = true }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }
axum         = { workspace = true }
chrono       = { workspace = true }
uuid         = { workspace = true }
# Internal crates
sakaloka-core   = { workspace = true }
sakaloka-secure = { workspace = true }
sakaloka-data   = { workspace = true }

# Axum extras
tower       = "0.5"
tower-http  = { version = "0.6", features = ["trace", "cors"] }
axum-extra  = { version = "0.10", features = ["multipart"] }

# OpenAPI
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }

# Argon2 for password hashing
argon2 = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
