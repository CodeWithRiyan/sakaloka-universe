[package]
name = "sakaloka-venus"
version = "0.0.0"
description = "Sakaloka POS — Tauri desktop shell"
edition = "2021"

[lib]
name = "sakaloka_venus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
