name: "Sakaloka — Build & Release"

on:
  push:
    branches: [dev, main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - sit
          - demo
          - prod
      draft:
        description: "Create as draft release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

# ─────────────────────────────────────────────────────────────
# Environment resolution:
#   push dev branch       → dev
#   push main branch      → sit
#   tag v*-demo*          → demo
#   tag v* (no suffix)    → prod
#   workflow_dispatch      → user-selected
# ─────────────────────────────────────────────────────────────

jobs:
  resolve-env:
    name: "Resolve Environment"
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.resolve.outputs.env_name }}
      is_release: ${{ steps.resolve.outputs.is_release }}
      is_draft: ${{ steps.resolve.outputs.is_draft }}
      version_tag: ${{ steps.resolve.outputs.version_tag }}
    steps:
      - name: Determine environment from trigger
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
            IS_DRAFT="${{ github.event.inputs.draft }}"
            IS_RELEASE="true"
            VERSION_TAG="manual-$(date +%Y%m%d-%H%M%S)"
          elif [[ "${{ github.ref }}" == refs/tags/v*-demo* ]]; then
            ENV="demo"
            IS_DRAFT="true"
            IS_RELEASE="true"
            VERSION_TAG="${{ github.ref_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            ENV="prod"
            IS_DRAFT="false"
            IS_RELEASE="true"
            VERSION_TAG="${{ github.ref_name }}"
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            ENV="sit"
            IS_DRAFT="true"
            IS_RELEASE="false"
            VERSION_TAG=""
          elif [[ "${{ github.ref }}" == refs/heads/dev ]]; then
            ENV="dev"
            IS_DRAFT="true"
            IS_RELEASE="false"
            VERSION_TAG=""
          else
            echo "::error::Unknown trigger ref: ${{ github.ref }}"
            exit 1
          fi
          echo "env_name=$ENV"       >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "is_draft=$IS_DRAFT"     >> "$GITHUB_OUTPUT"
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "### Environment: \`$ENV\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Release: $IS_RELEASE | Draft: $IS_DRAFT | Tag: $VERSION_TAG" >> "$GITHUB_STEP_SUMMARY"

  build-desktop:
    name: "Desktop (${{ matrix.platform.name }}) — ${{ needs.resolve-env.outputs.env_name }}"
    needs: resolve-env
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform.os }}
    environment: ${{ needs.resolve-env.outputs.env_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-tauri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tauri-

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/venus/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/venus
        run: pnpm install --frozen-lockfile

      - name: Activate environment config
        working-directory: apps/venus
        shell: bash
        run: |
          if [ -f ".env.${{ needs.resolve-env.outputs.env_name }}" ]; then
            cp ".env.${{ needs.resolve-env.outputs.env_name }}" .env
          else
            echo "VITE_ENV=${{ needs.resolve-env.outputs.env_name }}" > .env
            echo "::warning::No .env.${{ needs.resolve-env.outputs.env_name }} found, created minimal .env"
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/venus
          tauriScript: pnpm tauri
          tagName: ${{ needs.resolve-env.outputs.version_tag || '' }}
          releaseName: "Sakaloka POS ${{ needs.resolve-env.outputs.version_tag }} (${{ needs.resolve-env.outputs.env_name }})"
          releaseDraft: ${{ needs.resolve-env.outputs.is_draft }}
          prerelease: ${{ needs.resolve-env.outputs.env_name != 'prod' }}
          args: --target ${{ matrix.platform.target }}

  build-android:
    name: "Android — ${{ needs.resolve-env.outputs.env_name }}"
    needs: resolve-env
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.env_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Rust stable with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/venus/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/venus
        run: pnpm install --frozen-lockfile

      - name: Activate environment config
        working-directory: apps/venus
        run: |
          if [ -f ".env.${{ needs.resolve-env.outputs.env_name }}" ]; then
            cp ".env.${{ needs.resolve-env.outputs.env_name }}" .env
          else
            echo "VITE_ENV=${{ needs.resolve-env.outputs.env_name }}" > .env
            echo "::warning::No .env.${{ needs.resolve-env.outputs.env_name }} found, created minimal .env"
          fi

      - name: Initialize Tauri Android project
        working-directory: apps/venus
        run: pnpm tauri android init

      - name: Build Android APK (debug)
        if: ${{ needs.resolve-env.outputs.env_name != 'prod' }}
        working-directory: apps/venus
        run: pnpm tauri android build --apk

      - name: Decode signing keystore
        if: ${{ needs.resolve-env.outputs.env_name == 'prod' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/keystore.jks

      - name: Build Android APK (signed release)
        if: ${{ needs.resolve-env.outputs.env_name == 'prod' }}
        working-directory: apps/venus
        run: pnpm tauri android build --apk
        env:
          TAURI_ANDROID_KEYSTORE_PATH: /tmp/keystore.jks
          TAURI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAURI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Find APK
        id: find-apk
        run: |
          APK=$(find apps/venus/src-tauri/gen/android -name "*.apk" -type f | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $APK .apk)-${{ needs.resolve-env.outputs.env_name }}.apk" >> "$GITHUB_OUTPUT"

      - name: Rename APK with environment suffix
        run: |
          cp "${{ steps.find-apk.outputs.path }}" \
             "/tmp/${{ steps.find-apk.outputs.name }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ needs.resolve-env.outputs.env_name }}
          path: /tmp/${{ steps.find-apk.outputs.name }}

      - name: Upload APK to release
        if: needs.resolve-env.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-env.outputs.version_tag }}
          draft: ${{ needs.resolve-env.outputs.is_draft }}
          files: /tmp/${{ steps.find-apk.outputs.name }}

  # ─────────────────────────────────────────────────────────────
  # 🖥️ Build POS Web Docker Image → ghcr.io
  # ─────────────────────────────────────────────────────────────
  build-web:
    name: "POS Web Docker — ${{ needs.resolve-env.outputs.env_name }}"
    needs: resolve-env
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.env_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sakaloka-pos
          tags: |
            type=raw,value=${{ needs.resolve-env.outputs.env_name }}
            type=sha,prefix=${{ needs.resolve-env.outputs.env_name }}-
            type=raw,value=latest,enable=${{ needs.resolve-env.outputs.env_name == 'prod' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/venus
          file: apps/venus/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ENV=${{ needs.resolve-env.outputs.env_name }}
          cache-from: type=gha,scope=venus-${{ needs.resolve-env.outputs.env_name }}
          cache-to: type=gha,mode=max,scope=venus-${{ needs.resolve-env.outputs.env_name }}

  # ─────────────────────────────────────────────────────────────
  # 🌍 Build API Docker Image → ghcr.io
  # ─────────────────────────────────────────────────────────────
  build-api:
    name: "API Docker — ${{ needs.resolve-env.outputs.env_name }}"
    needs: resolve-env
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.env_name }}
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sakaloka-api
          tags: |
            type=raw,value=${{ needs.resolve-env.outputs.env_name }}
            type=sha,prefix=${{ needs.resolve-env.outputs.env_name }}-
            type=raw,value=latest,enable=${{ needs.resolve-env.outputs.env_name == 'prod' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # 🚀 Deploy API to VPS
  # ─────────────────────────────────────────────────────────────
  deploy-api:
    name: "Deploy API — ${{ needs.resolve-env.outputs.env_name }}"
    needs: [resolve-env, build-api]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.env_name }}
    concurrency:
      group: deploy-${{ needs.resolve-env.outputs.env_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout (for deploy files)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy

      - name: Validate required secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.VPS_HOST }}" ] && MISSING="$MISSING VPS_HOST"
          [ -z "${{ secrets.VPS_SSH_USER }}" ] && MISSING="$MISSING VPS_SSH_USER"
          [ -z "${{ secrets.VPS_SSH_KEY }}" ] && MISSING="$MISSING VPS_SSH_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING — configure them in GitHub Settings > Secrets"
            exit 1
          fi

      - name: Prepare deploy directory on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            ENV="${{ needs.resolve-env.outputs.env_name }}"
            DEPLOY_DIR="/opt/sakaloka/${ENV}"
            mkdir -p "${DEPLOY_DIR}/config"

      - name: Copy deploy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/docker-compose.base.yml,deploy/docker-compose.${{ needs.resolve-env.outputs.env_name }}.yml,deploy/config/,deploy/deploy.sh"
          target: "/opt/sakaloka/${{ needs.resolve-env.outputs.env_name }}"
          strip_components: 1

      - name: Pull and restart services
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          SAKALOKA_ENV: ${{ needs.resolve-env.outputs.env_name }}
          SAKALOKA_JWT_SECRET: ${{ secrets.SAKALOKA_JWT_SECRET }}
          SURREALDB_USER: ${{ secrets.SURREALDB_USER }}
          SURREALDB_PASS: ${{ secrets.SURREALDB_PASS }}
          QDRANT_MASTER_KEY: ${{ secrets.QDRANT_MASTER_KEY }}
          ZENOH_USER: ${{ secrets.ZENOH_USER }}
          ZENOH_PASS: ${{ secrets.ZENOH_PASS }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,SAKALOKA_ENV,SAKALOKA_JWT_SECRET,SURREALDB_USER,SURREALDB_PASS,QDRANT_MASTER_KEY,ZENOH_USER,ZENOH_PASS
          script: |
            set -euo pipefail
            DEPLOY_DIR="/opt/sakaloka/${SAKALOKA_ENV}"
            cd "${DEPLOY_DIR}"

            # Generate .env if not present (first deploy)
            if [ ! -f .env ]; then
              echo "==> Creating .env from CI secrets (first deploy)"
              cat > .env <<ENVEOF
            SAKALOKA_ENV=${SAKALOKA_ENV}
            SAKALOKA_JWT_SECRET=${SAKALOKA_JWT_SECRET}
            SURREALDB_USER=${SURREALDB_USER:-root}
            SURREALDB_PASS=${SURREALDB_PASS}
            QDRANT_MASTER_KEY=${QDRANT_MASTER_KEY}
            ZENOH_USER=${ZENOH_USER:-earth}
            ZENOH_PASS=${ZENOH_PASS}
            RUST_LOG=info
            ENVEOF
              chmod 600 .env
            fi

            # Login to ghcr.io
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            # Pull latest images and deploy
            chmod +x deploy.sh
            ./deploy.sh "${SAKALOKA_ENV}" pull
            ./deploy.sh "${SAKALOKA_ENV}" up

            # Verify API health
            echo "==> Waiting for API health check..."
            case ${SAKALOKA_ENV} in
              dev)  PORT=60000 ;;
              sit)  PORT=60100 ;;
              demo) PORT=60200 ;;
              prod) PORT=60300 ;;
            esac
            for i in $(seq 1 30); do
              if curl -sf "http://localhost:${PORT}/health" > /dev/null 2>&1; then
                echo "API is healthy!"
                exit 0
              fi
              echo "  Attempt $i/30..."
              sleep 5
            done
            echo "::error::API health check failed after 150s"
            docker compose --env-file .env -f docker-compose.base.yml -f "docker-compose.${SAKALOKA_ENV}.yml" logs sakaloka-api --tail=50
            exit 1

  # ─────────────────────────────────────────────────────────────
  # 🚀 Deploy POS Web to VPS
  # ─────────────────────────────────────────────────────────────
  deploy-web:
    name: "Deploy POS Web — ${{ needs.resolve-env.outputs.env_name }}"
    needs: [resolve-env, build-web]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.env_name }}
    concurrency:
      group: deploy-web-${{ needs.resolve-env.outputs.env_name }}
      cancel-in-progress: false

    steps:
      - name: Validate required secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.VPS_HOST }}" ] && MISSING="$MISSING VPS_HOST"
          [ -z "${{ secrets.VPS_SSH_USER }}" ] && MISSING="$MISSING VPS_SSH_USER"
          [ -z "${{ secrets.VPS_SSH_KEY }}" ] && MISSING="$MISSING VPS_SSH_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING — configure them in GitHub Settings > Secrets"
            exit 1
          fi

      - name: Deploy POS Web container
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          SAKALOKA_ENV: ${{ needs.resolve-env.outputs.env_name }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,SAKALOKA_ENV
          script: |
            set -euo pipefail

            # Port mapping per environment
            case ${SAKALOKA_ENV} in
              dev)  PORT=60040 ;;
              sit)  PORT=60140 ;;
              demo) PORT=60240 ;;
              prod) PORT=60340 ;;
            esac

            CONTAINER="sakaloka-${SAKALOKA_ENV}-pos"
            IMAGE="ghcr.io/codewithriyan/sakaloka-pos:${SAKALOKA_ENV}"

            # Login to ghcr.io
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            # Pull latest image
            echo "==> Pulling ${IMAGE}..."
            docker pull "${IMAGE}"

            # Stop existing container if running
            docker rm -f "${CONTAINER}" 2>/dev/null || true

            # Start new container
            echo "==> Starting ${CONTAINER} on port ${PORT}..."
            docker run -d \
              --name "${CONTAINER}" \
              --restart unless-stopped \
              -p "127.0.0.1:${PORT}:80" \
              "${IMAGE}"

            # Health check
            echo "==> Waiting for POS Web health check..."
            for i in $(seq 1 15); do
              if curl -sf "http://localhost:${PORT}/healthz" > /dev/null 2>&1; then
                echo "POS Web is healthy!"
                exit 0
              fi
              echo "  Attempt $i/15..."
              sleep 2
            done
            echo "::error::POS Web health check failed after 30s"
            docker logs "${CONTAINER}" --tail=30
            exit 1
