name: "🌌 Sakaloka — Iron Curtain CI"

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  iron-curtain:
    name: "⚔️ Iron Curtain Checks"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable with components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # US-04: rustfmt check
      - name: "📐 cargo fmt --check"
        run: cargo fmt --all -- --check

      # US-04: Clippy with deny warnings (Iron Curtain enforcement)
      - name: "🔍 cargo clippy (deny warnings)"
        run: cargo clippy --workspace --all-targets -- -D warnings

      # US-02: Workspace build
      - name: "🔨 cargo build --workspace"
        run: cargo build --workspace

      # US-02 / AC-06: All tests including doc-tests
      - name: "🧪 cargo test --workspace"
        run: cargo test --workspace
        env:
          SAKALOKA_JWT_SECRET: "ci-test-secret-at-least-32-chars-long!"

      # AC-03: 100% public API documentation
      - name: "📚 cargo doc (deny missing_docs)"
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D missing_docs"
