name: "Sakaloka — Iron Curtain CI"

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  iron-curtain:
    name: "Iron Curtain Checks"
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SurrealDB
        run: |
          docker run -d --name surrealdb -p 58000:8000 \
            surrealdb/surrealdb:latest \
            start --user root --pass sakaloka-dev-password memory
          until docker exec surrealdb /surreal is-ready --log none 2>/dev/null; do
            sleep 2
          done
          echo "SurrealDB is ready"

      - name: Install system dependencies (Tauri / WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable with components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # US-04: rustfmt check
      - name: "cargo fmt --check"
        run: cargo fmt --all -- --check

      # US-04: Clippy with deny warnings (Iron Curtain enforcement)
      - name: "cargo clippy (deny warnings)"
        run: cargo clippy --workspace --all-targets -- -D warnings

      # US-02: Workspace build
      - name: "cargo build --workspace"
        run: cargo build --workspace

      # US-02 / AC-06: All tests including doc-tests
      - name: "cargo test --workspace"
        run: cargo test --workspace
        env:
          SAKALOKA_JWT_SECRET: "ci-test-secret-at-least-32-chars-long!"
          SURREALDB_URL: "ws://127.0.0.1:58000"
          SURREALDB_USER: "root"
          SURREALDB_PASS: "sakaloka-dev-password"

      # AC-03: 100% public API documentation
      - name: "cargo doc (deny missing_docs)"
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D missing_docs"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/venus/pnpm-lock.yaml

      - name: Install Venus dependencies
        working-directory: apps/venus
        run: pnpm install --frozen-lockfile

      - name: Generate Venus OpenAPI types
        working-directory: apps/venus
        run: pnpm run generate:types

      - name: Verify generated API artifacts are committed
        run: git diff --exit-code -- apps/venus/openapi.json apps/venus/src/types/generated.ts

      - name: Lint Venus
        working-directory: apps/venus
        run: pnpm lint

      - name: Build Venus
        working-directory: apps/venus
        run: pnpm build
