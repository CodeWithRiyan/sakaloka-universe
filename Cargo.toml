[workspace]
resolver = "2"
members = [
    "apps/api",
    "libs/core",
    "libs/data",
    "libs/secure",
    "libs/ai",
]

[workspace.dependencies]
# Async runtime
tokio       = { version = "1", features = ["full"] }

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Error handling
thiserror   = "2"
anyhow      = "1"

# Logging / tracing
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP
axum        = "0.8"

# Auth / Security
argon2       = { version = "0.5", features = ["std"] }
jsonwebtoken = "9"
uuid         = { version = "1", features = ["v4", "serde"] }
time         = { version = "0.3", features = ["serde"] }
rand_core    = { version = "0.6", features = ["getrandom"] }

# Database
surrealdb   = { version = "2", features = ["protocol-ws", "kv-mem"] }

# Vector DB
qdrant-client = "1"

# Messaging
zenoh       = "1"

# AI / Embeddings
burn        = { version = "0.16", features = ["ndarray"] }

# Loco framework
loco-rs     = { version = "0.14", features = ["with-db"] }

# Internal crates
sakaloka-core   = { path = "libs/core" }
sakaloka-secure = { path = "libs/secure" }
sakaloka-data   = { path = "libs/data" }
sakaloka-ai     = { path = "libs/ai" }
