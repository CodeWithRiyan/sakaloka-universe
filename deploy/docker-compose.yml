# Single compose file for ALL environments (dev / sit / demo / prod).
# Deploy folder layout (ONE folder on the VPS):
#
#   <DEPLOY_PATH>/
#     ├── docker-compose.yml   (this file)
#     ├── .env.dev
#     ├── .env.sit
#     ├── .env.demo
#     └── .env.prod
#
# CD picks the env-file per branch:
#   docker compose --env-file .env.$TAG -p sakaloka-$TAG up -d

services:
  sakaloka-api:
    image: ${REGISTRY}/${API_IMAGE}:${IMAGE_TAG}
    container_name: sakaloka-${IMAGE_TAG}-api
    init: true
    env_file:
      - .env.${IMAGE_TAG}
    ports:
      - "127.0.0.1:${API_HOST_PORT}:3000"
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  sakaloka-pos:
    image: ${REGISTRY}/${WEB_IMAGE}:${IMAGE_TAG}
    container_name: sakaloka-${IMAGE_TAG}-pos
    ports:
      - "127.0.0.1:${WEB_HOST_PORT}:80"
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  app-net:
    name: ${NETWORK:-net-dev}
    external: true
