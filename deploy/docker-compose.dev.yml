# Sakaloka-Universe — Dev environment (single source of truth)
# Usage: docker compose --env-file .env up -d

services:

  sakaloka-api:
    image: ghcr.io/codewithriyan/sakaloka-api:${SAKALOKA_ENV:-dev}
    container_name: sakaloka-dev-api
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - SAKALOKA_JWT_SECRET=${SAKALOKA_JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - "127.0.0.1:60000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - net-dev

networks:
  net-dev:
    external: true