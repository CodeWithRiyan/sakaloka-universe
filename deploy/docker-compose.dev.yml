# Sakaloka-Universe — Dev environment overrides
# Dev uses external infra only (postgres managed in /srv/infra/dev)

services:

  sakaloka-api:
    image: ghcr.io/codewithriyan/sakaloka-api:${SAKALOKA_ENV:-dev}
    container_name: sakaloka-dev-api
    ports:
      - "127.0.0.1:60000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - net-dev

networks:
  net-dev:
    external: true
