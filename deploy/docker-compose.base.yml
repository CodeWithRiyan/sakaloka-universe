# =============================================================
# Sakaloka-Universe — Base Docker Compose for Server Deployment
#
# Usage: docker compose -f docker-compose.base.yml -f docker-compose.<env>.yml up -d
#
# This file defines shared service structure. Per-environment
# overrides (ports, volumes, storage mode) live in the env files.
# =============================================================

services:

  # ─────────────────────────────────────────────────────────────
  # 🐘 PostgreSQL — external infra (provided by VPS)
  # Set DATABASE_URL in .env or secrets
  # ─────────────────────────────────────────────────────────────

  sakaloka-api:
    image: ghcr.io/codewithriyan/sakaloka-api:${SAKALOKA_ENV:-dev}
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - SAKALOKA_JWT_SECRET=${SAKALOKA_JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
