# =========================================================
# SAKALOKA UNIVERSE — Nginx Reverse Proxy Configuration
#
# Domain: sakaloka.id
# Copy to: /srv/apps/infra/config/sakaloka.conf
# Reload:  docker exec infra-nginx nginx -s reload
#
# Port Matrix (all bound to 127.0.0.1):
#   Dev:  API=60000  POS=60040  SurrealDB=60010  Zenoh=60020  Qdrant=60030
#   SIT:  API=60100  POS=60140  SurrealDB=60110  Zenoh=60120  Qdrant=60130
#   Demo: API=60200  POS=60240  SurrealDB=60210  Zenoh=60220  Qdrant=60230
#   Prod: API=60300  POS=60340  SurrealDB=60310  Zenoh=60320  Qdrant=60330
# =========================================================

# --- UPSTREAM DEFINITIONS: API ---
upstream sakaloka_api_dev  { server 127.0.0.1:60000; }
upstream sakaloka_api_sit  { server 127.0.0.1:60100; }
upstream sakaloka_api_demo { server 127.0.0.1:60200; }
upstream sakaloka_api_prod { server 127.0.0.1:60300; }

# --- UPSTREAM DEFINITIONS: POS Web ---
upstream sakaloka_pos_dev  { server 127.0.0.1:60040; }
upstream sakaloka_pos_sit  { server 127.0.0.1:60140; }
upstream sakaloka_pos_demo { server 127.0.0.1:60240; }
upstream sakaloka_pos_prod { server 127.0.0.1:60340; }

# =========================================================
# SAKALOKA API — DEV (Port 60000)
# =========================================================
server {
    listen 80;
    server_name api-dev.sakaloka.id;

    proxy_intercept_errors on;
    error_page 502 504 =200 /maintenance.html;

    location /maintenance-assets/ {
        alias /srv/apps/static/maintenance/;
        access_log off;
    }

    location / {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin' always;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://sakaloka_api_dev;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /maintenance.html {
        root /srv/apps/static/maintenance;
        try_files /index.html =404;
        internal;
    }
}

